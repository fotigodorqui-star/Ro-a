name: Gerar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Criar app Cordova e compilar
        run: |
          npm install -g cordova@12
          cordova create app com.rocadonorte.jogo "Roça do Norte"
          cd app
          npm install three@0.128.0
          cp node_modules/three/build/three.min.js www/three.min.js
          sed 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' ../roca-do-norte-3d.html > www/index.html
          rm -rf www/css www/js www/img
          sed -i 's#</widget>#<preference name="Orientation" value="portrait" /><preference name="Fullscreen" value="true" /><preference name="android-minSdkVersion" value="24" /></widget>#' config.xml
          cordova platform add android@13.0.0
          cordova build android
      - uses: actions/upload-artifact@v4
        with:
          name: roca-do-norte-apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

